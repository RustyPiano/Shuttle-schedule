<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>线路8班车时刻表</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: { 50: '#fff7ed', 100: '#ffedd5', 200: '#fed7aa', 300: '#fdba74', 400: '#fb923c', 500: '#f97316', 600: '#ea580c', 700: '#c2410c', 800: '#9a3412', 900: '#7c2d12' },
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800 pb-safe">

    <!-- Sticky Header -->
    <header class="sticky top-0 z-50 glass border-b border-gray-200/50 shadow-sm">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <div>
                <h1 class="text-lg font-bold text-gray-900 flex items-center gap-2">
                    <i data-lucide="bus" class="w-5 h-5 text-primary-600"></i>
                    线路8 时刻表
                </h1>
                <p class="text-xs text-gray-500 mt-0.5" id="currentDateTime">加载中...</p>
            </div>
            <button onclick="resetToNow()" class="p-2 rounded-full bg-primary-50 text-primary-600 hover:bg-primary-100 transition active:scale-95">
                <i data-lucide="refresh-cw" class="w-4 h-4"></i>
            </button>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 py-4 space-y-5">

        <!-- Date Selection (Chips) -->
        <div class="flex gap-3 overflow-x-auto hide-scrollbar pb-1" id="dateChips">
            <!-- Populated by JS -->
        </div>

        <!-- Route Selection (Tabs) -->
        <div class="bg-gray-200/60 p-1 rounded-xl flex relative">
            <div id="tabIndicator" class="absolute top-1 bottom-1 w-[calc(50%-4px)] bg-white rounded-lg shadow-sm transition-all duration-300 ease-out translate-x-0"></div>
            <button onclick="switchRoute('route1')" class="flex-1 relative z-10 py-2 text-sm font-medium text-center rounded-lg transition-colors duration-200" id="tab-route1">
                三号院 → 一号院
            </button>
            <button onclick="switchRoute('route2')" class="flex-1 relative z-10 py-2 text-sm font-medium text-center rounded-lg transition-colors duration-200" id="tab-route2">
                一号院 → 三号院
            </button>
        </div>

        <!-- Next Bus Card -->
        <div id="nextBusCard" class="relative overflow-hidden rounded-2xl bg-gradient-to-br from-primary-500 to-primary-600 text-white shadow-lg shadow-primary-500/20 p-5">
            <div class="absolute top-0 right-0 -mt-4 -mr-4 w-24 h-24 bg-white/10 rounded-full blur-2xl"></div>
            <div class="absolute bottom-0 left-0 -mb-4 -ml-4 w-20 h-20 bg-black/5 rounded-full blur-xl"></div>
            
            <div class="relative z-10">
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <p class="text-primary-100 text-sm font-medium mb-1">下一班车</p>
                        <h2 class="text-4xl font-bold tracking-tight" id="nextBusTime">--:--</h2>
                    </div>
                    <div class="bg-white/20 backdrop-blur-md px-3 py-1 rounded-full border border-white/10">
                        <span class="text-xs font-semibold" id="timeRemaining">-- 分钟</span>
                    </div>
                </div>
                
                <div class="flex items-center gap-2 text-primary-50 text-sm">
                    <i data-lucide="clock" class="w-4 h-4"></i>
                    <span id="nextBusStatus">正在计算...</span>
                </div>
            </div>
        </div>

        <!-- Schedule List -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="px-4 py-3 border-b border-gray-50 bg-gray-50/50 flex justify-between items-center">
                <h3 class="font-semibold text-gray-700 flex items-center gap-2">
                    <i data-lucide="list" class="w-4 h-4 text-gray-400"></i>
                    全部班次
                </h3>
                <span class="text-xs text-gray-400" id="scheduleCount">0 班</span>
            </div>
            <div id="scheduleList" class="divide-y divide-gray-100 max-h-[50vh] overflow-y-auto scroll-smooth">
                <!-- Populated by JS -->
            </div>
        </div>

        <!-- Notes -->
        <div class="bg-blue-50 rounded-xl p-4 border border-blue-100">
            <h4 class="text-blue-800 font-semibold text-sm mb-2 flex items-center gap-2">
                <i data-lucide="info" class="w-4 h-4"></i>
                重要提示
            </h4>
            <ul class="space-y-1.5 text-xs text-blue-700/80 list-disc list-inside">
                <li>线路8在 <strong>17:00以后</strong> 的班次会途径科大佳园</li>
                <li>一号院内环线：7:30-12:30, 14:00-18:30</li>
                <li>三号院内环线：7:30-12:30, 14:00-18:30</li>
            </ul>
        </div>

        <div class="h-4"></div>
    </main>

    <script>
        // Data
        const scheduleData = {
            weekday: {
                route1: ['07:50', '09:45', '10:00', '12:00', '12:35', '13:45', '16:25', '17:05', '17:30', '17:40', '17:55', '18:25', '21:00', '21:30', '21:35', '21:55', '22:15'],
                route2: ['07:05', '07:10', '07:20', '07:30', '09:20', '09:30', '11:25', '13:50', '14:00', '15:30', '16:25', '18:55', '21:00']
            },
            saturday: {
                route1: ['07:50', '10:00', '12:00', '12:35', '16:25', '17:30', '18:25', '21:35', '22:15'],
                route2: ['07:20', '09:30', '13:50', '15:30', '18:55']
            },
            sunday: {
                route1: ['12:35', '17:30', '22:15'],
                route2: ['07:20', '09:30', '13:50']
            }
        };

        // State
        let state = {
            selectedDate: 'today', // today, tomorrow, saturday, sunday
            selectedRoute: 'route1', // route1, route2
            targetDate: new Date()
        };

        // Init
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            initDateChips();
            updateTime();
            setInterval(updateTime, 1000);
            render();
        });

        function updateTime() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('zh-CN', { hour12: false, hour: '2-digit', minute: '2-digit' });
            const dateStr = now.toLocaleDateString('zh-CN', { month: 'long', day: 'numeric', weekday: 'long' });
            document.getElementById('currentDateTime').textContent = `${dateStr} ${timeStr}`;
            
            // Only update schedule status if looking at today to keep countdown accurate
            if (state.selectedDate === 'today') {
                updateNextBusStatus();
            }
        }

        function initDateChips() {
            const chips = [
                { id: 'today', label: '今天' },
                { id: 'tomorrow', label: '明天' },
                { id: 'saturday', label: '本周六' },
                { id: 'sunday', label: '本周日' }
            ];
            
            const container = document.getElementById('dateChips');
            container.innerHTML = chips.map(chip => `
                <button onclick="selectDate('${chip.id}')" 
                    class="date-chip whitespace-nowrap px-4 py-1.5 rounded-full text-sm font-medium transition-all border border-transparent"
                    id="chip-${chip.id}">
                    ${chip.label}
                </button>
            `).join('');
        }

        function selectDate(dateId) {
            state.selectedDate = dateId;
            
            // Calculate target date
            const now = new Date();
            let target = new Date();
            
            if (dateId === 'tomorrow') {
                target.setDate(now.getDate() + 1);
            } else if (dateId === 'saturday') {
                const day = now.getDay();
                const diff = (6 - day + 7) % 7;
                target.setDate(now.getDate() + (diff || 7)); // If today is Sat, show next Sat? Or today? Logic: "This Saturday" usually means upcoming or today.
                if (day === 6 && diff === 0) target = now; // If today is Sat, keep today
            } else if (dateId === 'sunday') {
                const day = now.getDay();
                const diff = (7 - day) % 7; // 0 is Sunday
                const daysToAdd = day === 0 ? 0 : 7 - day;
                target.setDate(now.getDate() + daysToAdd);
            }
            
            state.targetDate = target;
            render();
        }

        function switchRoute(routeId) {
            state.selectedRoute = routeId;
            render();
        }

        function getDayType(date) {
            const day = date.getDay();
            if (day === 0) return 'sunday';
            if (day === 6) return 'saturday';
            return 'weekday';
        }

        function render() {
            // Update Chips UI
            document.querySelectorAll('.date-chip').forEach(el => {
                const isSelected = el.id === `chip-${state.selectedDate}`;
                el.className = `date-chip whitespace-nowrap px-4 py-1.5 rounded-full text-sm font-medium transition-all border ${
                    isSelected 
                    ? 'bg-gray-900 text-white border-gray-900 shadow-md' 
                    : 'bg-white text-gray-600 border-gray-200 hover:bg-gray-50'
                }`;
            });

            // Update Tabs UI
            const isRoute1 = state.selectedRoute === 'route1';
            const indicator = document.getElementById('tabIndicator');
            const tab1 = document.getElementById('tab-route1');
            const tab2 = document.getElementById('tab-route2');
            
            indicator.style.transform = isRoute1 ? 'translateX(0)' : 'translateX(100%)';
            indicator.style.left = isRoute1 ? '4px' : '0px'; // Adjust for padding
            
            tab1.className = `flex-1 relative z-10 py-2 text-sm font-medium text-center rounded-lg transition-colors duration-200 ${isRoute1 ? 'text-gray-900' : 'text-gray-500 hover:text-gray-700'}`;
            tab2.className = `flex-1 relative z-10 py-2 text-sm font-medium text-center rounded-lg transition-colors duration-200 ${!isRoute1 ? 'text-gray-900' : 'text-gray-500 hover:text-gray-700'}`;

            // Get Schedule
            const dayType = getDayType(state.targetDate);
            const times = scheduleData[dayType][state.selectedRoute];
            
            // Render List & Next Bus
            renderScheduleList(times);
            updateNextBusStatus(times);
        }

        function renderScheduleList(times) {
            const list = document.getElementById('scheduleList');
            const now = new Date();
            const isToday = state.targetDate.toDateString() === now.toDateString();
            const currentMinutes = now.getHours() * 60 + now.getMinutes();

            document.getElementById('scheduleCount').textContent = `${times.length} 班`;

            let html = '';
            let foundNext = false;

            times.forEach((time, index) => {
                const [h, m] = time.split(':').map(Number);
                const timeMinutes = h * 60 + m;
                
                let status = 'future'; // future, next, past
                if (isToday) {
                    if (timeMinutes < currentMinutes) status = 'past';
                    else if (!foundNext) {
                        status = 'next';
                        foundNext = true;
                    }
                }

                // Styles
                let containerClass = 'px-4 py-3 flex justify-between items-center transition-colors ';
                let timeClass = 'text-lg font-mono font-medium ';
                let statusClass = 'text-xs px-2 py-0.5 rounded ';
                let icon = '';

                if (status === 'past') {
                    containerClass += 'bg-gray-50/50 text-gray-400';
                    timeClass += 'text-gray-400';
                    statusClass += 'bg-gray-100 text-gray-400';
                    icon = '<i data-lucide="check" class="w-4 h-4 opacity-50"></i>';
                } else if (status === 'next') {
                    containerClass += 'bg-primary-50 border-l-4 border-primary-500';
                    timeClass += 'text-primary-700 font-bold';
                    statusClass += 'bg-primary-100 text-primary-700 font-semibold';
                    icon = '<i data-lucide="clock" class="w-4 h-4 text-primary-500 animate-pulse"></i>';
                } else {
                    containerClass += 'hover:bg-gray-50';
                    timeClass += 'text-gray-700';
                    statusClass += 'bg-gray-100 text-gray-600';
                }

                html += `
                    <div class="${containerClass}" id="${status === 'next' ? 'nextBusItem' : ''}">
                        <div class="flex items-center gap-3">
                            ${icon || '<div class="w-4"></div>'}
                            <span class="${timeClass}">${time}</span>
                        </div>
                        <div class="${statusClass}">
                            ${status === 'past' ? '已发车' : (status === 'next' ? '即将发车' : '等待中')}
                        </div>
                    </div>
                `;
            });

            if (times.length === 0) {
                html = '<div class="p-8 text-center text-gray-400 text-sm">今日无班次</div>';
            }

            list.innerHTML = html;
            lucide.createIcons();
            
            // Scroll to next bus if exists
            if (isToday) {
                setTimeout(() => {
                    const nextEl = document.getElementById('nextBusItem');
                    if (nextEl) {
                        nextEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }, 100);
            }
        }

        function updateNextBusStatus(times) {
            // If times not provided, fetch from current state
            if (!times) {
                const dayType = getDayType(state.targetDate);
                times = scheduleData[dayType][state.selectedRoute];
            }

            const now = new Date();
            const isToday = state.targetDate.toDateString() === now.toDateString();
            
            const nextBusCard = document.getElementById('nextBusCard');
            const timeDisplay = document.getElementById('nextBusTime');
            const remainingDisplay = document.getElementById('timeRemaining');
            const statusDisplay = document.getElementById('nextBusStatus');

            if (!isToday) {
                // Not today, show first bus of that day
                if (times.length > 0) {
                    timeDisplay.textContent = times[0];
                    remainingDisplay.textContent = '非今日';
                    statusDisplay.textContent = `该日首班车`;
                    nextBusCard.className = 'relative overflow-hidden rounded-2xl bg-gradient-to-br from-gray-700 to-gray-800 text-white shadow-lg p-5';
                } else {
                    timeDisplay.textContent = '--:--';
                    remainingDisplay.textContent = '--';
                    statusDisplay.textContent = '该日无班次';
                    nextBusCard.className = 'relative overflow-hidden rounded-2xl bg-gray-400 text-white shadow-lg p-5';
                }
                return;
            }

            // It is today, calculate next bus
            const currentMinutes = now.getHours() * 60 + now.getMinutes();
            const nextBus = times.find(t => {
                const [h, m] = t.split(':').map(Number);
                return (h * 60 + m) >= currentMinutes;
            });

            if (nextBus) {
                const [h, m] = nextBus.split(':').map(Number);
                const busMinutes = h * 60 + m;
                const diff = busMinutes - currentMinutes;
                
                timeDisplay.textContent = nextBus;
                
                if (diff === 0) {
                    remainingDisplay.textContent = '现在';
                    statusDisplay.textContent = '正在发车，请抓紧时间';
                } else if (diff < 60) {
                    remainingDisplay.textContent = `${diff} 分钟`;
                    statusDisplay.textContent = `距离下一班还有 ${diff} 分钟`;
                } else {
                    const hours = Math.floor(diff / 60);
                    const mins = diff % 60;
                    remainingDisplay.textContent = `${hours}小时${mins}分`;
                    statusDisplay.textContent = `距离下一班还有 ${hours} 小时 ${mins} 分钟`;
                }

                // Style based on urgency
                if (diff <= 10) {
                    nextBusCard.className = 'relative overflow-hidden rounded-2xl bg-gradient-to-br from-red-500 to-orange-600 text-white shadow-lg shadow-orange-500/30 p-5';
                } else {
                    nextBusCard.className = 'relative overflow-hidden rounded-2xl bg-gradient-to-br from-primary-500 to-primary-600 text-white shadow-lg shadow-primary-500/20 p-5';
                }
            } else {
                timeDisplay.textContent = '已结束';
                remainingDisplay.textContent = '--';
                statusDisplay.textContent = '今日班车已全部结束';
                nextBusCard.className = 'relative overflow-hidden rounded-2xl bg-gray-400 text-white shadow-lg p-5';
            }
        }

        function resetToNow() {
            state.selectedDate = 'today';
            state.targetDate = new Date();
            render();
        }
    </script>
</body>
</html>
